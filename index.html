<style>
  * { box-sizing:border-box; }
  body { font-family:Arial,sans-serif; background:linear-gradient(160deg,#ebf4ff,#f7ebff); margin:0; padding:16px; color:#222; min-height:100vh; }
  .container { max-width:780px; margin:auto; }
  h1 { text-align:center; color:#2c5282; margin:6px 0 14px; }
  .card { background:#fff; border-radius:14px; padding:18px; margin-bottom:18px; box-shadow:0 3px 10px rgba(0,0,0,.1); }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { flex:1; background:#cbd5e0; color:#2d3748; font-weight:bold; }
  .tabs button.actif { background:#2c5282; color:#fff; }

  .joueur { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .avatar { font-size:34px; }
  .infoJ { flex:1; min-width:180px; }
  .titreJ { font-weight:bold; color:#2c5282; }
  .barreXP { height:14px; background:#e2e8f0; border-radius:8px; overflow:hidden; margin-top:4px; }
  .barreXP div { height:100%; width:0; background:linear-gradient(90deg,#48bb78,#38b2ac); transition:width .5s; }
  .petit { font-size:12px; color:#555; }
  .stats { display:flex; gap:10px; font-weight:bold; }
  .pastille { background:#edf2f7; border-radius:20px; padding:6px 12px; }
  .btnSon { background:#edf2f7; font-size:18px; padding:6px 10px; }

  .ecran { min-height:70px; background:#1a202c; color:#f7fafc; border-radius:10px; padding:12px 14px;
           font-size:26px; overflow-x:auto; display:flex; align-items:center; }

  .curseur-bloc { display:inline-block; width:2px; height:1.1em; background:#63b3ed; vertical-align:middle; animation:cl 1s steps(1) infinite; }
  @keyframes cl { 50% { opacity:0; } }
  .pave { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:12px; }
  .pave button { padding:12px 4px; font-size:17px; margin:0; border-radius:8px; background:#e2e8f0; color:#1a202c; border:none; cursor:pointer; min-height:46px; }

  canvas { width:100%; border:1px solid #e2e8f0; border-radius:8px; background:#fff; }

  .niveaux { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .niveaux button { background:#edf2f7; font-weight:bold; }
  .niveaux button.actif { background:#805ad5; color:#fff; }
  .modes { display:flex; gap:8px; margin-bottom:12px; }
  .modes button { background:#edf2f7; font-weight:bold; }
  .modes button.actif { background:#dd6b20; color:#fff; }
  .hud { display:flex; justify-content:space-between; align-items:center; margin:10px 0; font-weight:bold; flex-wrap:wrap; gap:8px; }
  .chrono { height:10px; background:#e2e8f0; border-radius:6px; overflow:hidden; margin-bottom:10px; }
  .chrono div { height:100%; width:100%; background:#48bb78; transition:width .25s linear, background .25s; }
  .feedback { margin-top:10px; font-weight:bold; font-size:17px; }
  .good { color:#38a169; } .bad { color:#e53e3e; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .indice { background:#fefcbf; color:#744210; font-weight:bold; }

  .pulse { animation:pulse .5s; }

  .badges { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-top:8px; }
  .badge { text-align:center; padding:10px 6px; border-radius:10px; background:#edf2f7; font-size:13px; filter:grayscale(1); opacity:.5; }

  details summary { cursor:pointer; font-size:1.17em; font-weight:bold; color:#2c5282; padding:4px 0; list-style:none; user-select:none; }
  details summary::-webkit-details-marker { display:none; }

  /* Mode Associe */

  .barrePct { height:6px; background:#e2e8f0; border-radius:4px; margin-top:3px; }
  .barrePct div { height:100%; border-radius:4px; }
</style>

<script>
/* =====================================================
   ÉDITEUR (modèle en arbre avec curseur)
   ===================================================== */
let racine = [];
let cur = {bloc: racine, i: 0};
let modeCourant = 'calc';

function nouveauContexte(){ racine = []; cur = {bloc:racine, i:0}; }

function ins(k){
  const b = cur.bloc;
  const simples = '0123456789xeπ+−×÷(),'.split('');
  if(simples.includes(k)){
    b.splice(cur.i,0,{t:'c',v:k}); cur.i++;
  } else if(k==='frac'){
    const n = {t:'frac', a:[], b:[]};
    let j = cur.i;
    while(j>0 && b[j-1].t==='c' && /[0-9x,πe]/.test(b[j-1].v)){ j--; }
    const prise = b.splice(j, cur.i-j); cur.i = j;
    n.a = prise;
    b.splice(cur.i,0,n);
    cur = prise.length ? {bloc:n.b, i:0} : {bloc:n.a, i:0};
  } else if(k==='pow' || k==='sq'){
    const n = {t:'pow', a:[]};
    b.splice(cur.i,0,n);
    if(k==='sq'){ n.a.push({t:'c',v:'2'}); cur = {bloc:b, i:cur.i+1}; }
    else cur = {bloc:n.a, i:0};
  } else if(k==='sqrt'){
    const n = {t:'sqrt', a:[]}; b.splice(cur.i,0,n); cur = {bloc:n.a, i:0};
  } else if(k==='exp'){
    const n = {t:'exp', a:[]}; b.splice(cur.i,0,n); cur = {bloc:n.a, i:0};
  } else if(['sin','cos','tan','ln'].includes(k)){
    const n = {t:'fn', n:k, a:[]}; b.splice(cur.i,0,n); cur = {bloc:n.a, i:0};
  }
  clic(); affiche();
}
function chercheParent(bloc, cible=racine){
  for(let idx=0; idx<cible.length; idx++){
    const n = cible[idx];
    for(const cle of ['a','b']){
      if(n[cle]){
        if(n[cle]===bloc) return {bloc:cible, i:idx+1, noeud:n, cle};
        const r = chercheParent(bloc, n[cle]); if(r) return r;
      }
    }
  }
  return null;
}
function droite(){
  const b=cur.bloc;
  if(cur.i<b.length) cur.i++;
  else {
    const p = chercheParent(b);
    if(p){
      if(p.noeud.t==='frac' && p.cle==='a') cur={bloc:p.noeud.b,i:0};
      else cur={bloc:p.bloc,i:p.i};
    }
  }
  affiche();
}
function gauche(){
  if(cur.i>0) cur.i--;
  else {
    const p=chercheParent(cur.bloc);
    if(p){
      if(p.noeud.t==='frac' && p.cle==='b') cur={bloc:p.noeud.a,i:p.noeud.a.length};
      else cur={bloc:p.bloc,i:p.i-1};
    }
  }
  affiche();
}
function eff(){
  const b=cur.bloc;
  if(cur.i>0){ b.splice(cur.i-1,1); cur.i--; }
  else {
    const p=chercheParent(b);
    if(p && b.length===0){ p.bloc.splice(p.i-1,1); cur={bloc:p.bloc,i:p.i-1}; }
    else if(p){ cur={bloc:p.bloc,i:p.i-1}; }
  }
  affiche();
}
function toutEff(){ nouveauContexte(); affiche(); }

/* ---------- Conversions ---------- */
function latexBloc(b, ici){
  let s='';
  for(let i=0;i<=b.length;i++){
    if(ici && cur.bloc===b && cur.i===i) s+='\\textcolor{#63b3ed}{\\mid}';
    if(i===b.length) break;
    s+=latexNoeud(b[i]);
  }
  return s || '\\square';
}
function latexNoeud(n){
  switch(n.t){
    case 'c':
      if(n.v==='×') return '\\,';
      if(n.v==='÷') return '\\div ';
      if(n.v==='−') return '-';
      if(n.v==='π') return '\\pi ';
      if(n.v===',') return '{,}';
      return n.v;
    case 'frac': return '\\dfrac{'+latexBloc(n.a,true)+'}{'+latexBloc(n.b,true)+'}';
    case 'pow':  return '^{'+latexBloc(n.a,true)+'}';
    case 'sqrt': return '\\sqrt{'+latexBloc(n.a,true)+'}';
    case 'exp':  return 'e^{'+latexBloc(n.a,true)+'}';
    case 'fn':   return (n.n==='ln'?'\\ln':'\\'+n.n)+'\\left('+latexBloc(n.a,true)+'\\right)';
  }
  return '';
}
function mjsBloc(b){
  let s='';
  for(let i=0;i<b.length;i++){
    const n=b[i];
    switch(n.t){
      case 'c': s += ({ '×':'*','÷':'/','−':'-',',':'.','π':'pi','e':'e' }[n.v]) ?? n.v; break;
      case 'frac': s += '(('+mjsBloc(n.a)+')/('+mjsBloc(n.b)+'))'; break;
      case 'pow':  s += '^('+mjsBloc(n.a)+')'; break;
      case 'sqrt': s += 'sqrt('+mjsBloc(n.a)+')'; break;
      case 'exp':  s += 'exp('+mjsBloc(n.a)+')'; break;
      case 'fn':   s += (n.n==='ln'?'log':n.n)+'('+mjsBloc(n.a)+')'; break;
    }
    const suiv=b[i+1];
    if(suiv && besoinMul(n,suiv)) s+='*';
  }
  return s;
}
function finValeur(n){ return n.t==='c' ? /[0-9xπe)]/.test(n.v) : ['frac','pow','sqrt','exp','fn'].includes(n.t); }
function debutValeur(n){ return n.t==='c' ? /[0-9xπe(]/.test(n.v) : ['frac','sqrt','exp','fn'].includes(n.t); }
function besoinMul(a,b){
  if(b.t==='pow') return false;
  if(a.t==='c' && b.t==='c' && /[0-9,]/.test(a.v) && /[0-9,]/.test(b.v)) return false;
  return finValeur(a) && debutValeur(b);
}
function tex(expr){
  const node = typeof expr==='string' ? math.parse(expr) : expr;
  let s = node.toTex({parenthesis:'keep', implicit:'hide'});
  s = convertirExp(s);
  s = s.replace(/\\mathrm\{log\}/g,'\\ln');
  return supprimerPoints(s);
}

function supprimerPoints(s){
  s = s.replace(/(\d(?:\.\d+)?)\s*\\cdot\s*(?=\d)/g, '$1\\times ');
  s = s.replace(/\\cdot\s*/g, '\\,');
  s = s.replace(/\\,(?=\s*[\^_)}])/g, '');
  s = s.replace(/\\,\\,+/g, '\\,');
  s = s.replace(/(\d)\\,(?=[a-zA-Z\\])/g, '$1');
  return s;
}

function convertirExp(s){
  const motifs = ['\\exp\\left(', '\\mathrm{exp}\\left(', 'exp\\left('];
  let trouve = true;
  while(trouve){
    trouve = false;
    for(const m of motifs){
      const debut = s.indexOf(m);
      if(debut === -1) continue;
      let prof = 1, i = debut + m.length;
      while(i < s.length && prof > 0){
        if(s.startsWith('\\left(', i)){ prof++; i += 6; }
        else if(s.startsWith('\\right)', i)){ prof--; if(prof===0) break; i += 7; }
        else i++;
      }
      const contenu = s.slice(debut + m.length, i);
      const fin = i + 7;
      s = s.slice(0, debut) + 'e^{' + contenu + '}' + s.slice(fin);
      trouve = true;
      break;
    }
  }
  return s;
}

function katexVers(el, latex){ katex.render(latex, el, {throwOnError:false}); }

function affiche(){
  const ec=document.getElementById('ecran');
  if(racine.length===0){
    ec.innerHTML = '<span class="curseur-bloc"></span> <span class="vide">&nbsp;Utilise le clavier ci-dessous…</span>';
    return;
  }
  katex.render(latexBloc(racine,true), ec, {throwOnError:false, trust:true});
}

/* =====================================================
   SON (Web Audio, aucun fichier externe)
   ===================================================== */
let sonActif = true, audioCtx = null;
function bip(freq, dur=0.12, type='sine', vol=0.15, delai=0){
  if(!sonActif) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime + delai;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur);
  }catch{}
}

function calculer(){
  const sortie=document.getElementById('sortie');
  try{
    const f = mjsBloc(racine);
    if(!f) throw new Error();
    const n = parseInt(document.getElementById('ordre').value);
    let d = math.parse(f);
    let html = '<div class="result" id="b0"></div>';
    const blocs=[['b0','f(x) = '+tex(d)]];
    for(let i=1;i<=n;i++){
      d = math.simplify(math.derivative(d,'x'));
      blocs.push(['b'+i, 'f'+"'".repeat(i)+'(x) = \\boldsymbol{'+tex(d)+'}']);
      html += `<div class="result" id="b${i}"></div>`;
    }
    const p=document.getElementById('point').value.trim().replace(',','.');
    if(p!==''){
      const val = math.evaluate(d.toString(), {x: math.evaluate(p)});
      blocs.push(['bp', 'f'+"'".repeat(n)+'('+p+') = '+math.round(val,6)]);
      html += '<div class="result" id="bp"></div>';
    }
    html += etapes(f);
    sortie.innerHTML = html;
    blocs.forEach(([id,l])=>katexVers(document.getElementById(id),l));
    sortie.querySelectorAll('.steps li').forEach(li=>katexInline(li));
    dessiner(math.parse(f));
  }catch(e){
    sortie.innerHTML = `<div class="result error">Expression incomplète ou invalide. Vérifie les parenthèses et les cases vides.</div>`;
  }
}
function katexInline(el){
  el.innerHTML = el.innerHTML.replace(/\$([^$]+)\$/g,(m,l)=>katex.renderToString(l,{throwOnError:false}));
}
function etapes(f){
  const l=[];
  if(/sin|cos|tan|exp|log|sqrt/.test(f)) l.push("Fonction usuelle : utilise le tableau des dérivées usuelles.");
  if(/\)\s*\^|(sin|cos|exp|log|sqrt|tan)\([^x)]/.test(f)) l.push("Fonction composée : $(f\\circ g)' = g'\\,f'(g)$");
  if(/\*/.test(f.replace(/\d\*x|\d\*\(/g,''))) l.push("Produit : $(uv)' = u'v + uv'$");
  if(/\//.test(f)) l.push("Quotient : $\\left(\\dfrac{u}{v}\\right)' = \\dfrac{u'v - uv'}{v^2}$");
  if(/\^/.test(f)) l.push("Puissance : $(x^n)' = n\\,x^{n-1}$");
  if(/[+-]/.test(f.replace(/^-/,''))) l.push("Somme ou différence : on dérive terme par terme.");
  if(!l.length) l.push("Applique directement la formule de dérivation correspondante.");
  return `<h4>💡 Méthode</h4><ul class="steps">${l.map(s=>`<li>${s}</li>`).join('')}</ul>`;
}

/* ---------- Graphique + tangente interactive ---------- */
let graphe = null;
let xTan = null;

function dessiner(node){
  const c=document.getElementById('graph');
  const W=c.width,H=c.height,xmin=-6,xmax=6;
  const f=node.compile(), df=math.derivative(node,'x').compile();
  let ys=[];
  for(let i=0;i<=200;i++){const x=xmin+(xmax-xmin)*i/200;try{const y=f.evaluate({x});if(isFinite(y)&&Math.abs(y)<1e4)ys.push(y);}catch{}}
  let ymax=ys.length?Math.min(Math.max(...ys.map(Math.abs)),20):10; if(ymax<2)ymax=2;
  graphe={f,df,W,H,xmin,xmax,ymax};
  const p=parseFloat(document.getElementById('point').value.trim().replace(',','.'));
  xTan = isFinite(p) ? p : 1;
  trace();
}

function trace(){
  if(!graphe) return;
  const {f,df,W,H,xmin,xmax,ymax}=graphe;
  const c=document.getElementById('graph'), ctx=c.getContext('2d');
  const X=x=>(x-xmin)/(xmax-xmin)*W, Y=y=>H/2-(y/ymax)*(H/2);
  ctx.clearRect(0,0,W,H);

  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
  for(let x=Math.ceil(xmin);x<=xmax;x++){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();}
  ctx.strokeStyle='#4a5568';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),H);ctx.stroke();

  const courbe=(fn,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();let deb=true;
    for(let i=0;i<=800;i++){
      const x=xmin+(xmax-xmin)*i/800; let y; try{y=fn.evaluate({x});}catch{y=NaN;}
      if(!isFinite(y)||Math.abs(y)>ymax*3){deb=true;continue;}
      if(deb){ctx.moveTo(X(x),Y(y));deb=false;}else ctx.lineTo(X(x),Y(y));
    }
    ctx.stroke();
  };
  courbe(f,'#3182ce'); courbe(df,'#e53e3e');

  const info=document.getElementById('infoTangente');
  let y0,m;
  try{ y0=f.evaluate({x:xTan}); m=df.evaluate({x:xTan}); }catch{ y0=NaN; }
  if(!isFinite(y0)||!isFinite(m)||typeof y0!=='number'){ info.style.display='none'; return; }

  ctx.strokeStyle='#38a169';ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(X(xmin),Y(y0+m*(xmin-xTan)));
  ctx.lineTo(X(xmax),Y(y0+m*(xmax-xTan)));
  ctx.stroke();

  ctx.fillStyle='#3182ce';ctx.beginPath();ctx.arc(X(xTan),Y(y0),7,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#e53e3e';ctx.beginPath();ctx.arc(X(xTan),Y(m),6,0,7);ctx.fill();
  ctx.setLineDash([5,5]);ctx.strokeStyle='#a0aec0';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X(xTan),Y(y0));ctx.lineTo(X(xTan),Y(m));ctx.stroke();
  ctx.setLineDash([]);

  const r2=v=>math.round(v,3);
  const b=y0-m*xTan;
  info.style.display='block';
  katex.render(
    `x=${r2(xTan)}\\quad f(x)=${r2(y0)}\\quad \\color{#e53e3e}{f'(x)=${r2(m)}}\\\\[4pt]`+
    `\\color{#38a169}{y=${r2(m)}\\,x ${b<0?'-':'+'} ${Math.abs(r2(b))}}`,
    info,{throwOnError:false,displayMode:false});
}

(function(){
  const c=document.getElementById('graph');
  let actif=false;
  function deplace(e){
    if(!graphe) return;
    const rect=c.getBoundingClientRect();
    const px=(e.clientX-rect.left)/rect.width;
    xTan=graphe.xmin+Math.max(0,Math.min(1,px))*(graphe.xmax-graphe.xmin);
    trace();
  }
  c.addEventListener('pointerdown',e=>{    actif=true; c.setPointerCapture(e.pointerId); deplace(e);
  });
  c.addEventListener('pointermove',e=>{ if(actif) deplace(e); });
  c.addEventListener('pointerup',()=>{ actif=false; });
  c.addEventListener('pointercancel',()=>{ actif=false; });
})();

/* ---------- Vérification ---------- */
function verifier(){
  if(!exoCourant || vies<=0) return;
  const saisie = mjsBloc(racine);
  const fb = document.getElementById('feedback');
  if(!saisie){ fb.className='feedback bad'; fb.textContent='Entre une réponse avant de vérifier.'; return; }
  let ok = false;
  try{
    const sol = exoCourant.solution.compile();
    const rep = math.parse(saisie).compile();
    ok = true;
    const tests = [0.37,0.91,1.43,1.87,2.31,-0.42,-0.83];
    let valides = 0;
    for(const x of tests){
      let a, b;
      try{ a = sol.evaluate({x}); b = rep.evaluate({x}); }catch{ continue; }
      if(typeof a!=='number' || typeof b!=='number' || !isFinite(a) || !isFinite(b)) continue;
      valides++;
      if(Math.abs(a-b) > 1e-6*(1+Math.abs(a))){ ok = false; break; }
    }
    if(valides<3) ok = false;
  }catch{
    fb.className='feedback bad'; fb.textContent='Expression invalide. Vérifie ta saisie.'; return;
  }
  const duree = (Date.now()-debutQuestion)/1000;
  essais++; profil.total++;
  enregistrerStat('exo'+niveauJeu, ok, ok ? serie+1 : 0);
  if(ok){
    arreterChrono();
    serie++; reussitesSession++; profil.bonnes++;
    if(serie>profil.meilleureSerie) profil.meilleureSerie=serie;
    if(niveauJeu===3) profil.expert++;
    if(duree<8) profil.rapide++;
    if(nbIndices===0) profil.sansIndice++;
    const gain = 10*niveauJeu + Math.min(serie,10)*2 + (modeJeu==='defi' ? Math.round(tempsRestant/5) : 0);
    fb.className='feedback good pulse';
    fb.textContent = '✅ Bravo ! +'+gain+' XP';
    sonBon();
    gagnerXP(gain);
    majHud();
    setTimeout(nouvelExo,1500);
  } else {
    serie = 0;
    fb.className='feedback bad';
    fb.innerHTML = '❌ Ce n\'est pas ça. Réessaie ou demande un indice.';
    document.getElementById('ecran').classList.add('secoue');
    setTimeout(()=>document.getElementById('ecran').classList.remove('secoue'),400);
    sonMauvais();
    perdreVie();
    majHud(); majProfil(); sauver();
  }
}

function indice(){
  if(!exoCourant || vies<=0) return;
  nbIndices++;
  gagnerXP(-5);
  const f = exoCourant.expr;
  const fb = document.getElementById('feedback');
  const conseils = [];
    if(/\)\s*\^|(sin|cos|exp|log|sqrt|tan)\([^x)]/.test(f)) conseils.push("C'est une fonction composée : pense à $(f\\circ g)' = g'\\,f'(g)$.");
  if(/\*/.test(f.replace(/\d\*x|\d\*\(/g,'')) && !/^\d/.test(f)) conseils.push("C'est un produit : $(uv)' = u'v + uv'$.");
  if(/\//.test(f)) conseils.push("C'est un quotient : $\\left(\\dfrac{u}{v}\\right)' = \\dfrac{u'v-uv'}{v^2}$.");
  if(/^x\^\d|^\d\*x\^/.test(f)) conseils.push("Utilise $(x^n)' = n\\,x^{n-1}$.");
  if(!conseils.length) conseils.push("Dérive terme par terme avec les formules usuelles.");
  fb.className='feedback';
  fb.style.color='#744210';
  fb.innerHTML = '💡 ' + conseils[Math.min(nbIndices-1,conseils.length-1)].replace(/\$([^$]+)\$/g,(m,l)=>katex.renderToString(l,{throwOnError:false}));
  if(nbIndices>=3){
    fb.innerHTML += '<br>Début de la solution : <span id="indSol"></span>';
    const t = tex(exoCourant.solution);
    katexVers(document.getElementById('indSol'), "f'(x) = "+t.slice(0,Math.ceil(t.length/3))+"\\ldots");
  }
}

function passer(){
  if(!exoCourant || vies<=0) return;
  arreterChrono();
  enregistrerStat('exo'+niveauJeu, false, 0);
  essais++; profil.total++; serie=0;
  const fb = document.getElementById('feedback');
  fb.className='feedback bad';
  fb.innerHTML = 'Réponse : <span id="repPasse"></span>';
  katexVers(document.getElementById('repPasse'), "f'(x) = "+tex(exoCourant.solution));
  perdreVie();
  majHud(); majProfil(); sauver();
  if(vies>0) setTimeout(nouvelExo,2500);
}

/* =====================================================
   MODE ASSOCIE
   ===================================================== */
const BANQUES_ASSOC = {
  1: ['x^2','x^3','sin(x)','cos(x)','exp(x)/3','x^2/2-x','x^3/3-x'],
  2: ['x^3-3*x','x^4/4-x^2','sin(2*x)/2','x*exp(-x/2)','cos(x)+x/2','x^2*exp(-x/2)','sin(x)+x/2'],
  3: ['x*sin(x)','exp(-x^2/2)','x^3*exp(-x/2)','sin(x)*cos(x)','x*cos(x)','x^5/5-x^3','exp(x/2)*sin(x)']
};
let niveauAssoc = 1;
let assocBonne = -1, assocBloque = false, assocSerie = 0;
const COULEURS_ASSOC = ['#e53e3e','#805ad5','#dd6b20'];

function choisirNiveauAssoc(n){
  niveauAssoc = n;
  document.querySelectorAll('#niveauxAssoc button').forEach(b=>b.classList.toggle('actif',+b.dataset.n===n));
  assocSerie = 0;
  assocNouveau();
}

function tracerCourbe(canvas, fn, couleur, ymax, avecAxes, epaisseur){
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  const xmin=-4, xmax=4;
  const X = x=>(x-xmin)/(xmax-xmin)*W, Y = y=>H/2-(y/ymax)*(H/2);
  if(avecAxes){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
    for(let x=Math.ceil(xmin);x<=xmax;x++){ ctx.beginPath(); ctx.moveTo(X(x),0); ctx.lineTo(X(x),H); ctx.stroke(); }
    ctx.strokeStyle='#4a5568'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(W,Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0),0); ctx.lineTo(X(0),H); ctx.stroke();
  }
  ctx.strokeStyle = couleur; ctx.lineWidth = epaisseur||2.5;
  ctx.beginPath(); let deb = true;
  for(let i=0;i<=400;i++){
    const x = xmin+(xmax-xmin)*i/400; let y;
    try{ y = fn.evaluate({x}); }catch{ y = NaN; }
    if(typeof y!=='number' || !isFinite(y) || Math.abs(y)>ymax*2){ deb = true; continue; }
    if(deb){ ctx.moveTo(X(x),Y(y)); deb = false; } else ctx.lineTo(X(x),Y(y));
  }
  ctx.stroke();
}

function amplitude(fn){
  let m = 0;
  for(let i=0;i<=200;i++){
    const x = -4+8*i/200;
    try{ const y = fn.evaluate({x}); if(typeof y==='number' && isFinite(y)) m = Math.max(m,Math.abs(y)); }catch{}
  }
  return m<1 ? 1 : Math.min(m*1.15, 30);
}

function assocNouveau(){
  assocBloque = false;
  document.getElementById('assocMsg').textContent = '';
  document.getElementById('assocMsg').className = 'feedback';

  const banque = BANQUES_ASSOC[niveauAssoc];
  const fExpr = banque[Math.floor(Math.random()*banque.length)];
  const dExpr = math.derivative(fExpr,'x').toString();

  const autres = melanger(banque.filter(e=>e!==fExpr));
  let leurre1 = math.derivative(autres[0],'x').toString();
  let leurre2 = math.derivative(autres[1],'x').toString();
  if(leurre1===dExpr) leurre1 = math.derivative(autres[2],'x').toString();
  if(leurre2===dExpr || leurre2===leurre1) leurre2 = math.derivative(autres[3] || autres[2],'x').toString();

  const options = melanger([dExpr, leurre1, leurre2]);
  assocBonne = options.indexOf(dExpr);

  katex.render(tex(fExpr), document.getElementById('assocF'), {throwOnError:false});

  const fFn = math.compile(fExpr);
  const cMain = document.getElementById('assocMain');
  tracerCourbe(cMain, fFn, '#3182ce', amplitude(fFn), true, 3);

  const zone = document.getElementById('assocChoix');
  zone.innerHTML = '';
  options.forEach((expr,i)=>{
    const btn = document.createElement('button');
    const cv = document.createElement('canvas');
    cv.width = 240; cv.height = 160;
    const fn = math.compile(expr);
    tracerCourbe(cv, fn, COULEURS_ASSOC[i], amplitude(fn), true, 2.5);
    btn.appendChild(cv);
    const lab = document.createElement('div');
    lab.style.fontWeight = 'bold'; lab.textContent = 'Courbe '+(i+1);
    btn.appendChild(lab);
    btn.onclick = ()=>assocRepondre(i);
    zone.appendChild(btn);
  });
}

function assocRepondre(i){
  if(assocBloque) return;
  assocBloque = true;
  const msg = document.getElementById('assocMsg');
  const boutons = document.querySelectorAll('#assocChoix button');
  profil.total++;
  const ok = (i===assocBonne);
  enregistrerStat('assoc'+niveauAssoc, ok, ok ? assocSerie+1 : 0);
  boutons[assocBonne].style.borderColor = '#38a169';
  boutons[assocBonne].style.background = '#f0fff4';
  if(ok){
    assocSerie++;
    profil.bonnes++;
    if(assocSerie>profil.meilleureSerie) profil.meilleureSerie = assocSerie;
    const gain = 10*niveauAssoc + 5 + Math.min(assocSerie,10)*2;
    msg.className = 'feedback good pulse';
    msg.textContent = '✅ Bien vu ! +'+gain+' XP';
    sonBon();
    gagnerXP(gain);
  } else {
    assocSerie = 0;
    boutons[i].style.borderColor = '#e53e3e';
    boutons[i].style.background = '#fff5f5';
    msg.className = 'feedback bad';
    msg.textContent = '❌ Raté. Regarde où f est croissante, décroissante, et où elle admet un extremum : la dérivée y est positive, négative ou nulle.';
    sonMauvais();
    profil.total += 0;
    sauver();
  }
  setTimeout(()=>{ if(modeCourant==='assoc') assocNouveau(); }, ok ? 1500 : 3500);
}

/* =====================================================
   FORMULES À RETENIR
   ===================================================== */
const FORMULES = [
  "(k)' = 0 \\qquad (x)' = 1 \\qquad (x^n)' = n\\,x^{n-1}",
  "(\\sqrt{x})' = \\dfrac{1}{2\\sqrt{x}} \\qquad \\left(\\dfrac{1}{x}\\right)' = -\\dfrac{1}{x^2}",
  "(e^{x})' = e^{x} \\qquad (\\ln x)' = \\dfrac{1}{x}",
  "(\\sin x)' = \\cos x \\qquad (\\cos x)' = -\\sin x \\qquad (\\tan x)' = 1+\\tan^2 x = \\dfrac{1}{\\cos^2 x}",
  "(u+v)' = u'+v' \\qquad (k\\,u)' = k\\,u'",
  "(uv)' = u'v+uv'",
  "\\left(\\dfrac{u}{v}\\right)' = \\dfrac{u'v-uv'}{v^2}",
  "(u^n)' = n\\,u'\\,u^{n-1} \\qquad (e^{u})' = u'\\,e^{u} \\qquad (\\ln u)' = \\dfrac{u'}{u}",
  "(\\sin(ax+b))' = a\\cos(ax+b) \\qquad (\\cos(ax+b))' = -a\\sin(ax+b)",
  "(f\\circ g)'(x) = g'(x)\\,f'(g(x))"
];
function afficherFormules(){
  const ul = document.getElementById('formules');
  ul.innerHTML = FORMULES.map(()=>'<li></li>').join('');
  ul.querySelectorAll('li').forEach((li,i)=>katexVers(li, FORMULES[i]));
}

charger();
