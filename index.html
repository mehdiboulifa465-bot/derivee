<style>

<script>
/* =====================================================
   ÉDITEUR (modèle en arbre avec curseur)
   ===================================================== */
let racine = [];
let cur = {bloc: racine, i: 0};
let modeCourant = 'calc';

function nouveauContexte(){ racine = []; cur = {bloc:racine, i:0}; }

function ins(k){
  const b = cur.bloc;
  const simples = '0123456789xeπ+−×÷(),'.split('');
  if(simples.includes(k)){
    b.splice(cur.i,0,{t:'c',v:k}); cur.i++;
  } else if(k==='frac'){
    const n = {t:'frac', a:[], b:[]};
    let j = cur.i;
    while(j>0 && b[j-1].t==='c' && /[0-9x,πe]/.test(b[j-1].v)){ j--; }
    const prise = b.splice(j, cur.i-j); cur.i = j;
    n.a = prise;
    b.splice(cur.i,0,n);
    cur = prise.length ? {bloc:n.b, i:0} : {bloc:n.a, i:0};
  } else if(k==='pow' || k==='sq'){
    const n = {t:'pow', a:[]};
    b.splice(cur.i,0,n);
    if(k==='sq'){ n.a.push({t:'c',v:'2'}); cur = {bloc:b, i:cur.i+1}; }
    else cur = {bloc:n.a, i:0};
  } else if(k==='sqrt'){
    const n = {t:'sqrt', a:[]}; b.splice(cur.i,0,n); cur = {bloc:n.a, i:0};
  } else if(k==='exp'){
    const n = {t:'exp', a:[]}; b.splice(cur.i,0,n); cur = {bloc:n.a, i:0};
  } else if(['sin','cos','tan','ln'].includes(k)){
    const n = {t:'fn', n:k, a:[]}; b.splice(cur.i,0,n); cur = {bloc:n.a, i:0};
  }
  clic(); affiche();
}
function chercheParent(bloc, cible=racine){
  for(let idx=0; idx<cible.length; idx++){
    const n = cible[idx];
    for(const cle of ['a','b']){
      if(n[cle]){
        if(n[cle]===bloc) return {bloc:cible, i:idx+1, noeud:n, cle};
        const r = chercheParent(bloc, n[cle]); if(r) return r;
      }
    }
  }
  return null;
}
function droite(){
  const b=cur.bloc;
  if(cur.i<b.length) cur.i++;
  else {
    const p = chercheParent(b);
    if(p){
      if(p.noeud.t==='frac' && p.cle==='a') cur={bloc:p.noeud.b,i:0};
      else cur={bloc:p.bloc,i:p.i};
    }
  }
  affiche();
}
function gauche(){
  if(cur.i>0) cur.i--;
  else {
    const p=chercheParent(cur.bloc);
    if(p){
      if(p.noeud.t==='frac' && p.cle==='b') cur={bloc:p.noeud.a,i:p.noeud.a.length};
      else cur={bloc:p.bloc,i:p.i-1};
    }
  }
  affiche();
}
function eff(){
  const b=cur.bloc;
  if(cur.i>0){ b.splice(cur.i-1,1); cur.i--; }
  else {
    const p=chercheParent(b);
    if(p && b.length===0){ p.bloc.splice(p.i-1,1); cur={bloc:p.bloc,i:p.i-1}; }
    else if(p){ cur={bloc:p.bloc,i:p.i-1}; }
  }
  affiche();
}
function toutEff(){ nouveauContexte(); affiche(); }

/* ---------- Conversions ---------- */
function latexBloc(b, ici){
  let s='';
  for(let i=0;i<=b.length;i++){
    if(ici && cur.bloc===b && cur.i===i) s+='\\textcolor{#63b3ed}{\\mid}';
    if(i===b.length) break;
    s+=latexNoeud(b[i]);
  }
  return s || '\\square';
}
function latexNoeud(n){
  switch(n.t){
    case 'c':
      if(n.v==='×') return '\\times ';
      if(n.v==='÷') return '\\div ';
      if(n.v==='−') return '-';
      if(n.v==='π') return '\\pi ';
      if(n.v===',') return '{,}';
      return n.v;
    case 'frac': return '\\dfrac{'+latexBloc(n.a,true)+'}{'+latexBloc(n.b,true)+'}';
    case 'pow':  return '^{'+latexBloc(n.a,true)+'}';
    case 'sqrt': return '\\sqrt{'+latexBloc(n.a,true)+'}';
    case 'exp':  return 'e^{'+latexBloc(n.a,true)+'}';
    case 'fn':   return (n.n==='ln'?'\\ln':'\\'+n.n)+'\\left('+latexBloc(n.a,true)+'\\right)';
  }
  return '';
}
function mjsBloc(b){
  let s='';
  for(let i=0;i<b.length;i++){
    const n=b[i];
    switch(n.t){
      case 'c': s += ({ '×':'*','÷':'/','−':'-',',':'.','π':'pi','e':'e' }[n.v]) ?? n.v; break;
      case 'frac': s += '(('+mjsBloc(n.a)+')/('+mjsBloc(n.b)+'))'; break;
      case 'pow':  s += '^('+mjsBloc(n.a)+')'; break;
      case 'sqrt': s += 'sqrt('+mjsBloc(n.a)+')'; break;
      case 'exp':  s += 'exp('+mjsBloc(n.a)+')'; break;
      case 'fn':   s += (n.n==='ln'?'log':n.n)+'('+mjsBloc(n.a)+')'; break;
    }
    const suiv=b[i+1];
    if(suiv && besoinMul(n,suiv)) s+='*';
  }
  return s;
}
function finValeur(n){ return n.t==='c' ? /[0-9xπe)]/.test(n.v) : ['frac','pow','sqrt','exp','fn'].includes(n.t); }
function debutValeur(n){ return n.t==='c' ? /[0-9xπe(]/.test(n.v) : ['frac','sqrt','exp','fn'].includes(n.t); }
function besoinMul(a,b){
  if(b.t==='pow') return false;
  if(a.t==='c' && b.t==='c' && /[0-9,]/.test(a.v) && /[0-9,]/.test(b.v)) return false;
  return finValeur(a) && debutValeur(b);
}
function tex(expr){
  const node = typeof expr==='string' ? math.parse(expr) : expr;
  // Transforme exp(u) en e^u pour l'affichage
  const noeud = node.transform(n=>{
    if(n.isFunctionNode && n.fn.name==='exp' && n.args.length===1){
      return new math.OperatorNode('^','pow',[new math.SymbolNode('e'), n.args[0]]);
    }
    return n;
  });
  return noeud.toTex({parenthesis:'keep', implicit:'hide'})
             .replace(/\\mathrm\{log\}/g,'\\ln').replace(/\\cdot/g,'\\cdot\\,');
}
function katexVers(el, latex){ katex.render(latex, el, {throwOnError:false}); }

function affiche(){
  const ec=document.getElementById('ecran');
  if(racine.length===0){
    ec.innerHTML = '<span class="curseur-bloc"></span> <span class="vide">&nbsp;Utilise le clavier ci-dessous…</span>';
    return;
  }
  katex.render(latexBloc(racine,true), ec, {throwOnError:false, trust:true});
}

/* =====================================================
   SON (Web Audio, aucun fichier externe)
   ===================================================== */
let sonActif = true, audioCtx = null;
function bip(freq, dur=0.12, type='sine', vol=0.15, delai=0){
  if(!sonActif) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime + delai;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur);
  }catch{}
}
function clic(){ bip(520,0.04,'square',0.04); }
function sonBon(){ bip(523,0.12,'triangle'); bip(659,0.12,'triangle',0.15,0.1); bip(784,0.2,'triangle',0.15,0.2); }
function sonMauvais(){ bip(220,0.25,'sawtooth',0.12); bip(160,0.3,'sawtooth',0.12,0.15); }
function sonNiveau(){ [523,659,784,1047].forEach((f,i)=>bip(f,0.18,'triangle',0.15,i*0.12)); }
function basculeSon(){ sonActif=!sonActif; document.getElementById('btnSon').textContent=sonActif?'🔊':'🔇'; sauver(); }

/* =====================================================
   PROFIL, XP, BADGES
   ===================================================== */
const TITRES=['Apprenti','Initié','Calculateur','Analyste','Expert','Maître','Légende'];
const AVATARS=['🧙','🧑‍🎓','🧑‍🔬','🦉','🚀','👑','🐉'];
const BADGES=[
  {id:'premier',  ico:'🎉', nom:'Première réussite', test:p=>p.bonnes>=1},
  {id:'dix',      ico:'🔟', nom:'10 bonnes réponses', test:p=>p.bonnes>=10},
  {id:'cinquante',ico:'💯', nom:'50 bonnes réponses', test:p=>p.bonnes>=50},
  {id:'serie5',   ico:'🔥', nom:'Série de 5', test:p=>p.meilleureSerie>=5},
  {id:'serie10',  ico:'🌋', nom:'Série de 10', test:p=>p.meilleureSerie>=10},
  {id:'expert',   ico:'🧠', nom:'Réussite en Expert', test:p=>p.expert>=1},
  {id:'defi',     ico:'⚡', nom:'Défi terminé', test:p=>p.defis>=1},
  {id:'rapide',   ico:'⏱️', nom:'Réponse en moins de 8 s', test:p=>p.rapide>=1},
  {id:'sans',     ico:'🕊️', nom:'5 réussites sans indice', test:p=>p.sansIndice>=5},
  {id:'niv5',     ico:'🏆', nom:'Niveau 5 atteint', test:p=>niveauDe(p.xp)>=5}
];
let profil = {xp:0,bonnes:0,total:0,meilleureSerie:0,expert:0,defis:0,rapide:0,sansIndice:0,badges:[],son:true};
let serie = 0;

function sauver(){ profil.son=sonActif; try{localStorage.setItem('derivQuest',JSON.stringify(profil));}catch{} }
function charger(){
  try{
    const s=localStorage.getItem('derivQuest');
    if(s) profil=Object.assign(profil,JSON.parse(s));
    sonActif = profil.son!==false;

  }catch{}
}
function reinitialiser(){

}
/* Seuils d'XP cumulés : 0, 100, 300, 600, 1000, ... */
function seuil(n){ return 50*n*(n-1); }
function niveauDe(xp){ let n=1; while(xp>=seuil(n+1)) n++; return n; }
function majProfil(){
  const n=niveauDe(profil.xp), a=seuil(n), b=seuil(n+1);
  const idx=Math.min(TITRES.length-1,Math.floor((n-1)/2));
  document.getElementById('titreJ').textContent=TITRES[idx]+' – Niv. '+n;
  document.getElementById('avatar').textContent=AVATARS[idx];
  document.getElementById('xpBarre').style.width=(100*(profil.xp-a)/(b-a))+'%';
  document.getElementById('xpTxt').textContent=(profil.xp-a)+' / '+(b-a)+' XP';
  document.getElementById('xpTotal').textContent=profil.xp;
  document.getElementById('serie').textContent=serie;
}
function majBadges(){
  document.getElementById('badges').innerHTML = BADGES.map(b=>
    `<div class="badge ${profil.badges.includes(b.id)?'ok':''}"><span class="ico">${b.ico}</span>${b.nom}</div>`).join('');
}
function gagnerXP(pts){
  const avant=niveauDe(profil.xp);
  profil.xp=Math.max(0,profil.xp+pts);
  const apres=niveauDe(profil.xp);
  if(apres>avant){ toast('🎊 Niveau '+apres+' atteint !'); sonNiveau(); confettis(); }
  verifierBadges(); majProfil(); sauver();
}
function verifierBadges(){
  BADGES.forEach(b=>{
    if(!profil.badges.includes(b.id) && b.test(profil)){
      profil.badges.push(b.id);
      setTimeout(()=>toast('🏅 Badge : '+b.nom),700);
    }
  });
  majBadges();
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2500);
}

function confettis(){

  c.width=innerWidth; c.height=innerHeight;

    vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:4+Math.random()*5,col:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*6}));
  let frames=0;
  (function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.col;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(++frames<150) requestAnimationFrame(anim); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* =====================================================
   MODE CALCUL
   ===================================================== */
function calculer(){
  const sortie=document.getElementById('sortie');
  try{
    const f = mjsBloc(racine);
    if(!f) throw new Error();
    const n = parseInt(document.getElementById('ordre').value);
    let d = math.parse(f);
    let html = '<div class="result" id="b0"></div>';
    const blocs=[['b0','f(x) = '+tex(d)]];
    for(let i=1;i<=n;i++){
      d = math.simplify(math.derivative(d,'x'));
      blocs.push(['b'+i, 'f'+"'".repeat(i)+'(x) = \\boldsymbol{'+tex(d)+'}']);
      html += `<div class="result" id="b${i}"></div>`;
    }
    const p=document.getElementById('point').value.trim().replace(',','.');
    if(p!==''){
      const val = math.evaluate(d.toString(), {x: math.evaluate(p)});
      blocs.push(['bp', 'f'+"'".repeat(n)+'('+p+') = '+math.round(val,6)]);
      html += '<div class="result" id="bp"></div>';
    }
    html += etapes(f);
    sortie.innerHTML = html;
    blocs.forEach(([id,l])=>katexVers(document.getElementById(id),l));
    sortie.querySelectorAll('.steps li').forEach(li=>katexInline(li));
    dessiner(math.parse(f));
  }catch(e){
    sortie.innerHTML = `<div class="result error">Expression incomplète ou invalide. Vérifie les parenthèses et les cases vides.</div>`;
  }
}
function katexInline(el){
  el.innerHTML = el.innerHTML.replace(/\$([^$]+)\$/g,(m,l)=>katex.renderToString(l,{throwOnError:false}));
}
function etapes(f){
  const l=[];
  if(/sin|cos|tan|exp|log|sqrt/.test(f)) l.push("Fonction usuelle : utilise le tableau des dérivées usuelles.");
  if(/\)\s*\^|(sin|cos|exp|log|sqrt|tan)\([^x)]/.test(f)) l.push("Fonction composée : $(f\\circ g)' = g' \\times f'(g)$");
  if(/\*/.test(f.replace(/\d\*x|\d\*\(/g,''))) l.push("Produit : $(uv)' = u'v + uv'$");
  if(/\//.test(f)) l.push("Quotient : $\\left(\\dfrac{u}{v}\\right)' = \\dfrac{u'v - uv'}{v^2}$");
  if(/\^/.test(f)) l.push("Puissance : $(x^n)' = n\\,x^{n-1}$");
  if(/[+-]/.test(f.replace(/^-/,''))) l.push("Somme ou différence : on dérive terme par terme.");
  if(!l.length) l.push("Applique directement la formule de dérivation correspondante.");
  return `<h4>💡 Méthode</h4><ul class="steps">${l.map(s=>`<li>${s}</li>`).join('')}</ul>`;
}

/* ---------- Graphique + tangente interactive ---------- */
let graphe = null;
let xTan = null;

function dessiner(node){
  const c=document.getElementById('graph');
  const W=c.width,H=c.height,xmin=-6,xmax=6;
  const f=node.compile(), df=math.derivative(node,'x').compile();
  let ys=[];
  for(let i=0;i<=200;i++){const x=xmin+(xmax-xmin)*i/200;try{const y=f.evaluate({x});if(isFinite(y)&&Math.abs(y)<1e4)ys.push(y);}catch{}}
  let ymax=ys.length?Math.min(Math.max(...ys.map(Math.abs)),20):10; if(ymax<2)ymax=2;
  graphe={f,df,W,H,xmin,xmax,ymax};
  const p=parseFloat(document.getElementById('point').value.trim().replace(',','.'));
  xTan = isFinite(p) ? p : 1;
  trace();
}

function trace(){
  if(!graphe) return;
  const {f,df,W,H,xmin,xmax,ymax}=graphe;
  const c=document.getElementById('graph'), ctx=c.getContext('2d');
  const X=x=>(x-xmin)/(xmax-xmin)*W, Y=y=>H/2-(y/ymax)*(H/2);
  ctx.clearRect(0,0,W,H);

  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
  for(let x=Math.ceil(xmin);x<=xmax;x++){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();}
  ctx.strokeStyle='#4a5568';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),H);ctx.stroke();

  const courbe=(fn,col)=>{
    ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();let deb=true;
    for(let i=0;i<=800;i++){
      const x=xmin+(xmax-xmin)*i/800; let y; try{y=fn.evaluate({x});}catch{y=NaN;}
      if(!isFinite(y)||Math.abs(y)>ymax*3){deb=true;continue;}
      if(deb){ctx.moveTo(X(x),Y(y));deb=false;}else ctx.lineTo(X(x),Y(y));
    }
    ctx.stroke();
  };
  courbe(f,'#3182ce'); courbe(df,'#e53e3e');

  const info=document.getElementById('infoTangente');
  let y0,m;
  try{ y0=f.evaluate({x:xTan}); m=df.evaluate({x:xTan}); }catch{ y0=NaN; }
  if(!isFinite(y0)||!isFinite(m)||typeof y0!=='number'){ info.style.display='none'; return; }

  ctx.strokeStyle='#38a169';ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(X(xmin),Y(y0+m*(xmin-xTan)));
  ctx.lineTo(X(xmax),Y(y0+m*(xmax-xTan)));
  ctx.stroke();

  ctx.fillStyle='#3182ce';ctx.beginPath();ctx.arc(X(xTan),Y(y0),7,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#e53e3e';ctx.beginPath();ctx.arc(X(xTan),Y(m),6,0,7);ctx.fill();
  ctx.setLineDash([5,5]);ctx.strokeStyle='#a0aec0';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X(xTan),Y(y0));ctx.lineTo(X(xTan),Y(m));ctx.stroke();
  ctx.setLineDash([]);

  const r2=v=>math.round(v,3);
  const b=y0-m*xTan;
  info.style.display='block';
  katex.render(
    `x=${r2(xTan)}\\quad f(x)=${r2(y0)}\\quad \\color{#e53e3e}{f'(x)=${r2(m)}}\\\\[4pt]`+
    `\\color{#38a169}{y=${r2(m)}\\,x ${b<0?'-':'+'} ${Math.abs(r2(b))}}`,
    info,{throwOnError:false,displayMode:false});
}

(function(){
  const c=document.getElementById('graph');
  let actif=false;
  function deplace(e){
    if(!graphe) return;
    const rect=c.getBoundingClientRect();
    const px=(e.clientX-rect.left)/rect.width;
    xTan=graphe.xmin+Math.max(0,Math.min(1,px))*(graphe.xmax-graphe.xmin);
    trace();
  }
  c.addEventListener('pointerdown',e=>{actif=true;c.setPointerCapture(e.pointerId);deplace(e);});
  c.addEventListener('pointermove',e=>{if(actif)deplace(e);});
  c.addEventListener('pointerup',()=>actif=false);
  c.addEventListener('pointercancel',()=>actif=false);
})();

/* =====================================================
   MODE JEU : générateur d'exercices
   ===================================================== */
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v;do{v=r(a,b)}while(v===0);return v;};

const generateurs={
  1:[
    ()=>{const a=nz(-6,6),n=r(2,5);return {f:`${a}*x^${n}`,d:`${a*n}*x^${n-1}`,h:"Puissance : (xⁿ)′ = n·xⁿ⁻¹, le coefficient est conservé."};},
    ()=>{const a=nz(-5,5),b=nz(-9,9),c=r(2,4);return {f:`${a}*x^${c}+${b}*x`,d:`${a*c}*x^${c-1}+${b}`,h:"Dérive chaque terme séparément."};},
    ()=>{const a=nz(-5,5),b=nz(-8,8);return {f:`${a}*x^2+${b}`,d:`${2*a}*x`,h:"La dérivée d'une constante est 0."};},
    ()=>{const a=nz(2,6);return {f:`${a}*sin(x)`,d:`${a}*cos(x)`,h:"(sin x)′ = cos x"};},
    ()=>{const a=nz(2,6);return {f:`${a}*exp(x)`,d:`${a}*exp(x)`,h:"(eˣ)′ = eˣ"};}
  ],
  2:[
    ()=>({f:`x^2*exp(x)`,d:`2*x*exp(x)+x^2*exp(x)`,h:"Produit : (uv)′ = u′v + uv′"}),
    ()=>({f:`x*sin(x)`,d:`sin(x)+x*cos(x)`,h:"Produit : (uv)′ = u′v + uv′"}),
    ()=>({f:`x*log(x)`,d:`log(x)+1`,h:"Produit avec ln : (x·ln x)′ = ln x + 1"}),
    ()=>{const a=nz(2,6);return {f:`exp(${a}*x)`,d:`${a}*exp(${a}*x)`,h:"Composée : (e^u)′ = u′·e^u"};},
    ()=>{const a=nz(2,5);return {f:`sin(${a}*x)`,d:`${a}*cos(${a}*x)`,h:"Composée : (sin u)′ = u′·cos u"};},
    ()=>{const a=nz(2,5);return {f:`cos(${a}*x)`,d:`-${a}*sin(${a}*x)`,h:"Composée : (cos u)′ = −u′·sin u"};},
    ()=>{const a=nz(2,4);return {f:`(${a}*x+1)^2`,d:`${2*a}*(${a}*x+1)`,h:"Composée : (u²)′ = 2u′u"};},
    ()=>({f:`1/x`,d:`-1/x^2`,h:"Inverse : (1/x)′ = −1/x²"}),
    ()=>({f:`sqrt(x)`,d:`1/(2*sqrt(x))`,h:"(√x)′ = 1/(2√x)"})
  ],
  3:[
    ()=>{const a=r(2,4);return {f:`(x+${a})/(x-${a})`,d:`${-2*a}/(x-${a})^2`,h:"Quotient : (u/v)′ = (u′v − uv′)/v²"};},
    ()=>({f:`x^2*sin(x)`,d:`2*x*sin(x)+x^2*cos(x)`,h:"Produit : (uv)′ = u′v + uv′"}),
    ()=>{const a=r(2,4);return {f:`exp(x)*cos(${a}*x)`,d:`exp(x)*cos(${a}*x)-${a}*exp(x)*sin(${a}*x)`,h:"Produit puis composée."};},
    ()=>{const a=r(2,4);return {f:`log(${a}*x+1)`,d:`${a}/(${a}*x+1)`,h:"Composée : (ln u)′ = u′/u"};},
    ()=>({f:`sin(x)/x`,d:`(x*cos(x)-sin(x))/x^2`,h:"Quotient : (u/v)′ = (u′v − uv′)/v²"}),
    ()=>{const a=r(2,4);return {f:`sin(x^${a})`,d:`${a}*x^${a-1}*cos(x^${a})`,h:"Composée : (sin u)′ = u′·cos u, avec u = xⁿ."};},
    ()=>({f:`x*exp(-x)`,d:`exp(-x)-x*exp(-x)`,h:"Produit et composée : (e^{−x})′ = −e^{−x}"}),
    ()=>{const a=r(2,4);return {f:`sqrt(${a}*x+1)`,d:`${a}/(2*sqrt(${a}*x+1))`,h:"Composée : (√u)′ = u′/(2√u)"};}
  ]
};

/* ---------- État de la partie ---------- */
let niveauJeu=1, modeJeu='libre', exo=null;
let reussites=0, essais=0, vies=3, indiceUtilise=false, debutQuestion=0;
const TEMPS_DEFI=30;
let chronoId=null, tempsRestant=TEMPS_DEFI, partieFinie=false, questionsDefi=0;

function choisirNiveau(n){
  niveauJeu=n;
  document.querySelectorAll('#niveaux button').forEach(b=>b.classList.toggle('actif',+b.dataset.n===n));
  demarrerPartie();
}
function choisirModeJeu(m){
  modeJeu=m;
  document.getElementById('mLibre').classList.toggle('actif',m==='libre');
  document.getElementById('mDefi').classList.toggle('actif',m==='defi');
  demarrerPartie();
}
function demarrerPartie(){
  arreterChrono();
  reussites=0; essais=0; vies=3; serie=0; partieFinie=false; questionsDefi=0;
  document.getElementById('btnGo').disabled=false;
  majHUD(); majProfil();
  nouvelleQuestion();
}
function majHUD(){
  document.getElementById('vies').innerHTML = modeJeu==='defi'
    ? '❤️'.repeat(vies)+'🖤'.repeat(3-vies) : '☕ Mode libre';
  document.getElementById('scoreSession').textContent='Réussites : '+reussites+' / '+essais;
  document.getElementById('chronoBox').classList.toggle('cacher',modeJeu!=='defi');
}
function nouvelleQuestion(){
  if(partieFinie) return;
  const liste=generateurs[niveauJeu];
  let nouveau, essaisGen=0;
  do{ nouveau=liste[Math.floor(Math.random()*liste.length)](); essaisGen++; }
  while(exo && nouveau.f===exo.f && essaisGen<10);
  exo=nouveau; indiceUtilise=false; debutQuestion=Date.now();
  document.getElementById('exo').innerHTML='Calcule la dérivée de :<div class="result" id="exoTex"></div>';
  katexVers(document.getElementById('exoTex'),'f(x) = '+tex(exo.f));
  document.getElementById('feedback').innerHTML='';
  nouveauContexte(); affiche();
  if(modeJeu==='defi') lancerChrono();
}

/* ---------- Chrono ---------- */
function lancerChrono(){
  arreterChrono(); tempsRestant=TEMPS_DEFI; majChrono();
  chronoId=setInterval(()=>{
    tempsRestant-=0.25; majChrono();
    if(tempsRestant<=0){ arreterChrono(); tempsEcoule(); }
  },250);
}
function arreterChrono(){ if(chronoId){clearInterval(chronoId);chronoId=null;} }
function majChrono(){
  const b=document.getElementById('chronoBarre');
  const pct=Math.max(0,100*tempsRestant/TEMPS_DEFI);
  b.style.width=pct+'%';
  b.style.background = pct>50?'#48bb78':pct>20?'#ecc94b':'#e53e3e';
}
function tempsEcoule(){
  const fb=document.getElementById('feedback');
  fb.className='feedback bad';
  fb.innerHTML="⏰ Temps écoulé ! Réponse : <span id='sol'></span>";
  katexVers(document.getElementById('sol'),"f'(x) = "+tex(exo.d));
  perdreVie();
}

/* ---------- Vérification ---------- */
function verifier(){
  if(partieFinie) return;
  const fb=document.getElementById('feedback');
  let rep;
  try{
    rep=mjsBloc(racine);
    if(!rep) return;
    math.compile(rep);
  }catch{ fb.className='feedback bad'; fb.textContent='Expression incomplète ou invalide.'; return; }

  let ok=true;
  try{
    const a=math.compile(rep), b=math.compile(exo.d);
    for(const x of [0.5,1.3,2,2.7,3.9]){
      const va=a.evaluate({x}), vb=b.evaluate({x});
      if(typeof va!=='number' || Math.abs(va-vb)>1e-6*(1+Math.abs(vb))){ok=false;break;}
    }
  }catch{ ok=false; }

  arreterChrono();
  essais++; profil.total++;
  const duree=(Date.now()-debutQuestion)/1000;

  if(ok){
    reussites++; serie++; profil.bonnes++;
    if(serie>profil.meilleureSerie) profil.meilleureSerie=serie;
    if(niveauJeu===3) profil.expert++;
    if(duree<8) profil.rapide++;
    if(!indiceUtilise) profil.sansIndice++;

    let gain=10*niveauJeu;
    if(!indiceUtilise) gain+=5;
    if(duree<8) gain+=5;
    gain+=Math.min(serie,10)*2;
    if(modeJeu==='defi') gain+=Math.round(Math.max(0,tempsRestant)/3);

    fb.style.color='';
    fb.className='feedback good pulse';
    fb.innerHTML="✅ Bravo ! +"+gain+" XP"+(serie>=3?" · 🔥 série de "+serie:"");
    sonBon();
    gagnerXP(gain);
    majHUD();
    questionsDefi++;
    if(modeJeu==='defi' && questionsDefi>=10){ finDefi(true); return; }
    setTimeout(()=>{ fb.classList.remove('pulse'); nouvelleQuestion(); },1100);
  } else {
    fb.style.color='';
    fb.className='feedback bad';
    fb.innerHTML="❌ Ce n'est pas ça. Réponse attendue : <span id='sol'></span>";
    katexVers(document.getElementById('sol'),"f'(x) = "+tex(exo.d));
    document.getElementById('ecran').classList.add('secoue');
    setTimeout(()=>document.getElementById('ecran').classList.remove('secoue'),450);
    sonMauvais();
    serie=0;
    sauver();
    perdreVie();
  }
}

/* ---------- Vies et fin de partie ---------- */
function perdreVie(){
  serie=0;
  if(modeJeu==='defi'){
    vies--;
    majHUD(); majProfil();
    if(vies<=0){ finDefi(false); return; }
    setTimeout(()=>{ if(!partieFinie) nouvelleQuestion(); },2200);
  } else {
    majHUD(); majProfil();
    setTimeout(()=>{ if(!partieFinie) nouvelleQuestion(); },2500);
  }
}
function finDefi(victoire){
  partieFinie=true;
  arreterChrono();
  document.getElementById('btnGo').disabled=true;
  if(victoire){
    profil.defis++;
    gagnerXP(50);
    confettis();
  }
  sauver(); verifierBadges();
  const fb=document.getElementById('feedback');
  const html = victoire
    ? "🏆 Défi réussi ! Bonus +50 XP"
    : "💀 Plus de vies…";
  fb.className='feedback '+(victoire?'good':'bad');
  fb.innerHTML=html+`<div class="encart">Score final : <b>${reussites}</b> réussite(s) sur <b>${essais}</b><br>
    <button onclick="demarrerPartie()">🔄 Rejouer</button></div>`;
}

/* ---------- Indice et passer ---------- */
function indice(){
  if(modeCourant!=='exo' || partieFinie || !exo) return;
  const fb=document.getElementById('feedback');
  if(!indiceUtilise){ indiceUtilise=true; gagnerXP(-5); }
  fb.className='feedback';
  fb.style.color='#744210';
  fb.textContent='💡 '+exo.h;
}
function passer(){
  if(modeCourant!=='exo' || partieFinie || !exo) return;
  arreterChrono();
  essais++; profil.total++; serie=0;
  const fb=document.getElementById('feedback');
  fb.style.color='';
  fb.className='feedback bad';
  fb.innerHTML="⏭ Question passée. Réponse : <span id='sol'></span>";
  katexVers(document.getElementById('sol'),"f'(x) = "+tex(exo.d));
  sauver();
  perdreVie();
}

/* =====================================================
   MODE ASSOCIE LA COURBE
   ===================================================== */
const BANQUE_ASSOC = [
  'x^2','x^3','x^3-3*x','sin(x)','cos(x)','exp(x)/3','x^2/2-x',
  'x^4/4-x^2','sin(2*x)/2','x*exp(-x/2)','x^3/3-x','cos(x)+x/2'
];
let assocBonne=-1, assocBloque=false, assocSerie=0;

function tracerMini(cv, expr, couleur, ymax){
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height, xmin=-4, xmax=4;
  const X=x=>(x-xmin)/(xmax-xmin)*W, Y=y=>H/2-(y/ymax)*(H/2);
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;
  for(let x=-4;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();}
  ctx.strokeStyle='#4a5568';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),H);ctx.stroke();
  const fn=math.compile(expr);
  ctx.strokeStyle=couleur;ctx.lineWidth=3;ctx.beginPath();let deb=true;
  for(let i=0;i<=300;i++){
    const x=xmin+(xmax-xmin)*i/300; let y;
    try{y=fn.evaluate({x});}catch{y=NaN;}
    if(!isFinite(y)||Math.abs(y)>ymax*3){deb=true;continue;}
    if(deb){ctx.moveTo(X(x),Y(y));deb=false;}else ctx.lineTo(X(x),Y(y));
  }
  ctx.stroke();
}
function echelleAssoc(expr){
  const fn=math.compile(expr); let m=0;
  for(let i=0;i<=200;i++){
    const x=-4+8*i/200;
    try{const y=Math.abs(fn.evaluate({x}));if(isFinite(y))m=Math.max(m,y);}catch{}
  }
  return Math.min(Math.max(m,1),15);
}
function melanger(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function assocNouveau(){
  assocBloque=false;
  const msg=document.getElementById('assocMsg');
  msg.textContent=''; msg.className='feedback';
  const fExpr=BANQUE_ASSOC[Math.floor(Math.random()*BANQUE_ASSOC.length)];
  const dExpr=math.derivative(fExpr,'x').toString();

  const autres=melanger(BANQUE_ASSOC.filter(e=>e!==fExpr));
  let leurre2=math.derivative(autres[0],'x').toString();
  if(leurre2===dExpr) leurre2=math.derivative(autres[1],'x').toString();
  const options=melanger([dExpr,fExpr,leurre2]);
  assocBonne=options.indexOf(dExpr);

  katexVers(document.getElementById('assocF'), tex(fExpr));
  tracerMini(document.getElementById('assocMain'), fExpr, '#3182ce', echelleAssoc(fExpr));

  const zone=document.getElementById('assocChoix'); zone.innerHTML='';
  options.forEach((expr,i)=>{
    const b=document.createElement('button');
    const cv=document.createElement('canvas');
    cv.width=240; cv.height=160;
    b.appendChild(cv);
    const l=document.createElement('div');
    l.textContent=['A','B','C'][i]; l.style.cssText='font-weight:bold;margin-top:4px';
    b.appendChild(l);
    tracerMini(cv, expr, '#e53e3e', echelleAssoc(expr));
    b.onclick=()=>assocRepondre(i,b,zone);
    zone.appendChild(b);
  });
}
function assocRepondre(i,btn,zone){
  if(assocBloque) return;
  assocBloque=true;
  const msg=document.getElementById('assocMsg');
  const boutons=zone.children;
  profil.total++;
  if(i===assocBonne){
    assocSerie++; serie=assocSerie; profil.bonnes++;
    if(serie>profil.meilleureSerie) profil.meilleureSerie=serie;
    const gain=15+Math.min(assocSerie,10)*2;
    btn.style.borderColor='#38a169'; btn.style.background='#f0fff4';
    msg.className='feedback good pulse';
    msg.textContent='✅ Bravo ! +'+gain+' XP'+(assocSerie>=3?' · 🔥 série de '+assocSerie:'');
    sonBon(); gagnerXP(gain);
    setTimeout(()=>{ if(modeCourant==='assoc') assocNouveau(); },1400);
  } else {
    assocSerie=0; serie=0;
    btn.style.borderColor='#e53e3e'; btn.style.background='#fff5f5';
    boutons[assocBonne].style.borderColor='#38a169';
    boutons[assocBonne].style.background='#f0fff4';
    msg.className='feedback bad';
    msg.textContent='❌ Raté, la bonne réponse est '+['A','B','C'][assocBonne]+
      '. Indice : là où f a un sommet, f′ vaut 0 ; là où f monte, f′ est positive.';
    sonMauvais(); sauver(); majProfil();
  }
}

/* =====================================================
   FORMULES (bloc repliable)
   ===================================================== */
const F=[
 "(k)' = 0 \\quad ; \\quad (x)' = 1 \\quad ; \\quad (x^n)' = n\\,x^{n-1}",
 "(u+v)' = u'+v' \\quad ; \\quad (k\\,u)' = k\\,u'",
 "(uv)' = u'v + uv'",
 "\\left(\\dfrac{u}{v}\\right)' = \\dfrac{u'v - uv'}{v^2}",
 "(\\sin x)' = \\cos x \\quad ; \\quad (\\cos x)' = -\\sin x",
 "(e^x)' = e^x \\quad ; \\quad (\\ln x)' = \\dfrac{1}{x} \\quad ; \\quad (\\sqrt{x})' = \\dfrac{1}{2\\sqrt{x}}",
 "(f\\circ g)' = g' \\times f'(g)",
 "(e^{u})' = u'e^{u} \\quad ; \\quad (\\ln u)' = \\dfrac{u'}{u} \\quad ; \\quad (u^n)' = n\\,u'\\,u^{n-1}"
];
document.getElementById('formules').innerHTML=F.map(()=>'<li></li>').join('');
document.querySelectorAll('#formules li').forEach((li,i)=>katexVers(li,F[i]));

/* =====================================================
   CLAVIER PHYSIQUE
   ===================================================== */
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(t==='INPUT'||t==='SELECT'||t==='SUMMARY'||t==='TEXTAREA') return;
  if(modeCourant==='assoc') return;
  if(/^[0-9x+()]$/.test(e.key)) ins(e.key);
  else if(e.key==='-') ins('−');
  else if(e.key==='*') ins('×');
  else if(e.key==='/') { e.preventDefault(); ins('frac'); }
  else if(e.key==='^') ins('pow');
  else if(e.key===',' || e.key==='.') ins(',');
  else if(e.key==='Backspace') eff();
  else if(e.key==='ArrowRight') { e.preventDefault(); droite(); }
  else if(e.key==='ArrowLeft') { e.preventDefault(); gauche(); }
  else if(e.key==='Enter') valider();
});
